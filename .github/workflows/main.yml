---
name: CI

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --all-extras --dev --locked

      - uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        with:
          extra-args: --all-files --verbose --skip no-commit-to-branch

  tests:
    runs-on: ubuntu-26.04

    permissions:
      contents: read
      pull-requests: write

    services:
      postgres:
        image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --all-extras --dev --locked

      - name: Collect static files
        run: |
          uv run django-admin collectstatic --noinput

      - name: Run tests
        id: tests
        run: |
          set -o pipefail
          echo 'stdout<<EOF' > "$GITHUB_OUTPUT"
          uv run pytest --cov 2>&1 | tee -a "$GITHUB_OUTPUT"
          echo 'EOF' >> "$GITHUB_OUTPUT"

      - name: Upload snapshot diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshot-diffs
          path: snapshot_diffs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Add PR Comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: test_results
          message: |
            # Test results :white_check_mark:
            ```
            ${{ steps.tests.outputs.stdout }}
            ```

      - name: Remove PR Comment on failure
        if: failure()
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: test_results
          delete: true

  docker:
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build Docker image
        run: |
          docker build -t dailyword:test .

  home-assistant-build:
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test build
        uses: home-assistant/builder@2026.09.0 # zizmor: ignore[unpinned-uses] this needs to be pinned to a version, since it's used both for the action and the underlying Docker image
        with:
          args: |
            --test \
            --amd64 \
            --aarch64 \
            --target . \
            --image dailyword \
            --docker-hub serl
